name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

env:
  APP_NAME: Clips
  SCHEME: Clips
  PROJECT_FILE: Clips.xcodeproj
  PAGES_BASE_URL: https://roszkowski.dev/clips

jobs:
  build_release:
    runs-on: macos-15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "version=$VERSION"
            echo "release_tag=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$VERSION"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/${APP_NAME}.xcarchive"
            echo "EXPORT_DIR=$RUNNER_TEMP/export"
            echo "RELEASE_DIR=$RUNNER_TEMP/release"
            echo "SITE_DIR=$RUNNER_TEMP/site"
            echo "UPDATES_DIR=$RUNNER_TEMP/updates"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install xcodegen
          npm install --global create-dmg

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install changelog_cli
        run: |
          brew tap orestesgaolin/tap
          brew install changelog_cli

      - name: Generate changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            changelog_cli generate --start "$PREVIOUS_TAG" --end "$GITHUB_REF_NAME" --version "$VERSION" --output "$RUNNER_TEMP/RELEASE_NOTES.md"
          else
            changelog_cli generate --end "$GITHUB_REF_NAME" --version "$VERSION" --output "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi

      - name: Install Sparkle tools
        run: |
          curl -Ls https://github.com/sparkle-project/Sparkle/releases/download/2.9.2/Sparkle-2.9.2.tar.xz -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          chmod +x "$RUNNER_TEMP/sparkle/bin/"*

      - name: Import code-signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > "$KEY_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Archive signed app
        run: |
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_DEVELOPER_TEAM_ID }}" \
            SPARKLE_PUBLIC_ED_KEY="${{ secrets.SPARKLE_PUBLIC_ED_KEY }}" \
            clean archive

      - name: Validate archived app version
        run: |
          ARCHIVE_INFO_PLIST="$ARCHIVE_PATH/Products/Applications/${APP_NAME}.app/Contents/Info.plist"
          ARCHIVE_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_INFO_PLIST")
          ARCHIVE_BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVE_INFO_PLIST")

          if [ "$ARCHIVE_SHORT_VERSION" != "$VERSION" ]; then
            echo "Archived app short version mismatch: expected $VERSION, got $ARCHIVE_SHORT_VERSION"
            exit 1
          fi

          if [ "$ARCHIVE_BUILD_VERSION" != "${GITHUB_RUN_NUMBER}" ]; then
            echo "Archived app build version mismatch: expected ${GITHUB_RUN_NUMBER}, got $ARCHIVE_BUILD_VERSION"
            exit 1
          fi

          ARCHIVE_ICON_FILE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$ARCHIVE_INFO_PLIST" 2>/dev/null || true)
          ARCHIVE_ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$ARCHIVE_INFO_PLIST" 2>/dev/null || true)

          if [ "$ARCHIVE_ICON_FILE" != "AppIcon" ] || [ "$ARCHIVE_ICON_NAME" != "AppIcon" ]; then
            echo "Archived app icon metadata is missing or invalid: CFBundleIconFile=$ARCHIVE_ICON_FILE CFBundleIconName=$ARCHIVE_ICON_NAME"
            exit 1
          fi

          if [ ! -f "$ARCHIVE_PATH/Products/Applications/${APP_NAME}.app/Contents/Resources/AppIcon.icns" ]; then
            echo "Archived app is missing Contents/Resources/AppIcon.icns"
            exit 1
          fi

      - name: Export Developer ID app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_DEVELOPER_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          EXPORT_INFO_PLIST="$EXPORT_DIR/${APP_NAME}.app/Contents/Info.plist"
          EXPORT_ICON_FILE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$EXPORT_INFO_PLIST" 2>/dev/null || true)
          EXPORT_ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$EXPORT_INFO_PLIST" 2>/dev/null || true)

          if [ "$EXPORT_ICON_FILE" != "AppIcon" ] || [ "$EXPORT_ICON_NAME" != "AppIcon" ]; then
            echo "Exported app icon metadata is missing or invalid: CFBundleIconFile=$EXPORT_ICON_FILE CFBundleIconName=$EXPORT_ICON_NAME"
            exit 1
          fi

          if [ ! -f "$EXPORT_DIR/${APP_NAME}.app/Contents/Resources/AppIcon.icns" ]; then
            echo "Exported app is missing Contents/Resources/AppIcon.icns"
            exit 1
          fi

      - name: Notarize and staple
        run: |
          mkdir -p "$RELEASE_DIR"
          APP_PATH="$EXPORT_DIR/${APP_NAME}.app"
          ZIP_PATH="$RELEASE_DIR/${APP_NAME}-${VERSION}.zip"
          DMG_PATH="$RELEASE_DIR/${APP_NAME}-${VERSION}.dmg"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --key "$ASC_KEY_PATH" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --wait

          xcrun stapler staple "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          create-dmg \
            --overwrite \
            --identity="Developer ID Application" \
            "$APP_PATH" \
            "$RELEASE_DIR"

          # create-dmg outputs "App Name X.Y.Z.dmg" — rename to our convention
          CREATED_DMG=$(find "$RELEASE_DIR" -name "*.dmg" | head -n1)
          mv "$CREATED_DMG" "$DMG_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$ASC_KEY_PATH" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --wait

          xcrun stapler staple "$DMG_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG_PATH"

          shasum -a 256 "$ZIP_PATH" > "$RELEASE_DIR/${APP_NAME}-${VERSION}.zip.sha256"
          shasum -a 256 "$DMG_PATH" > "$RELEASE_DIR/${APP_NAME}-${VERSION}.dmg.sha256"

      - name: Generate Sparkle appcast
        run: |
          mkdir -p "$UPDATES_DIR" "$SITE_DIR/updates"

          RELEASE_ZIP="$RELEASE_DIR/${APP_NAME}-${VERSION}.zip"
          RELEASE_NOTES="$RUNNER_TEMP/RELEASE_NOTES.md"
          UPDATE_NOTES="$UPDATES_DIR/${APP_NAME}-${VERSION}.md"

          cp "$RELEASE_ZIP" "$UPDATES_DIR/${APP_NAME}-${VERSION}.zip"
          cp "$RELEASE_NOTES" "$UPDATE_NOTES"

          echo "${{ secrets.SPARKLE_PRIVATE_ED_KEY }}" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/" \
            --release-notes-url-prefix "${PAGES_BASE_URL}/updates/" \
            "$UPDATES_DIR"

          cp "$UPDATES_DIR/appcast.xml" "$SITE_DIR/appcast.xml"
          cp "$UPDATE_NOTES" "$SITE_DIR/updates/${APP_NAME}-${VERSION}.md"
          cp "$UPDATE_NOTES" "$SITE_DIR/updates/latest.md"
          if [ -f docs/updates/index.html ]; then
            cp docs/updates/index.html "$SITE_DIR/index.html"
          fi

      - name: Validate generated appcast
        run: |
          APPCAST_PATH="$SITE_DIR/appcast.xml"
          SHORT_VERSION=$(awk -F'[><]' '/<sparkle:shortVersionString>/{print $3; exit}' "$APPCAST_PATH")
          BUILD_VERSION=$(awk -F'[><]' '/<sparkle:version>/{print $3; exit}' "$APPCAST_PATH")
          ENCLOSURE_URL=$(sed -n 's|.*url="\([^"]*\)".*|\1|p' "$APPCAST_PATH" | head -n1)

          if [ "$SHORT_VERSION" != "$VERSION" ]; then
            echo "Appcast short version mismatch: expected $VERSION, got $SHORT_VERSION"
            exit 1
          fi

          if [ -z "$BUILD_VERSION" ]; then
            echo "Appcast build version is empty"
            exit 1
          fi

          EXPECTED_PREFIX="https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/"
          if [[ "$ENCLOSURE_URL" != ${EXPECTED_PREFIX}* ]]; then
            echo "Appcast enclosure URL mismatch: expected prefix $EXPECTED_PREFIX, got $ENCLOSURE_URL"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: |
            ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.zip
            ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.zip.sha256
            ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.dmg
            ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.dmg.sha256
            ${{ runner.temp }}/site/appcast.xml

      - name: Attest release artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.zip

      - name: Attest release disk image
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.dmg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy_pages:
    runs-on: ubuntu-latest
    needs: build_release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
