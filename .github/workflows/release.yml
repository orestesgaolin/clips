name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

env:
  APP_NAME: Clips
  SCHEME: Clips
  PROJECT_FILE: Clips.xcodeproj
  PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build_release:
    runs-on: macos-15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/${APP_NAME}.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_DIR=$RUNNER_TEMP/export" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          echo "SITE_DIR=$RUNNER_TEMP/site" >> "$GITHUB_ENV"
          echo "UPDATES_DIR=$RUNNER_TEMP/updates" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install xcodegen

      - name: Install changelog_cli
        run: |
          brew tap orestesgaolin/tap
          brew install changelog_cli

      - name: Generate changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            changelog_cli generate --start "$PREVIOUS_TAG" --end "$GITHUB_REF_NAME" --version "$VERSION" --output "$RUNNER_TEMP/RELEASE_NOTES.md"
          else
            changelog_cli generate --end "$GITHUB_REF_NAME" --version "$VERSION" --output "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi

      - name: Install Sparkle tools
        run: |
          curl -Ls https://github.com/sparkle-project/Sparkle/releases/download/2.9.2/Sparkle-2.9.2.tar.xz -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          chmod +x "$RUNNER_TEMP/sparkle/bin/"*

      - name: Import code-signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > "$KEY_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Archive signed app
        run: |
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_DEVELOPER_TEAM_ID }}" \
            SPARKLE_PUBLIC_ED_KEY="${{ secrets.SPARKLE_PUBLIC_ED_KEY }}" \
            clean archive

      - name: Export Developer ID app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_DEVELOPER_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize and staple
        run: |
          mkdir -p "$RELEASE_DIR"
          APP_PATH="$EXPORT_DIR/${APP_NAME}.app"
          ZIP_PATH="$RELEASE_DIR/${APP_NAME}-${VERSION}.zip"
          DMG_PATH="$RELEASE_DIR/${APP_NAME}-${VERSION}.dmg"
          DMG_STAGING="$RUNNER_TEMP/dmg-staging"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --key "$ASC_KEY_PATH" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --wait

          xcrun stapler staple "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"
          cp -R "$APP_PATH" "$DMG_STAGING/${APP_NAME}.app"
          ln -s /Applications "$DMG_STAGING/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$DMG_STAGING" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          DMG_SIGNING_IDENTITY=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n1)
          if [ -z "$DMG_SIGNING_IDENTITY" ]; then
            echo "Failed to locate a Developer ID Application signing identity for DMG signing."
            security find-identity -v -p codesigning
            exit 1
          fi
          codesign --force --timestamp --sign "$DMG_SIGNING_IDENTITY" "$DMG_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$ASC_KEY_PATH" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --wait

          xcrun stapler staple "$DMG_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG_PATH"

          shasum -a 256 "$ZIP_PATH" > "$RELEASE_DIR/${APP_NAME}-${VERSION}.zip.sha256"
          shasum -a 256 "$DMG_PATH" > "$RELEASE_DIR/${APP_NAME}-${VERSION}.dmg.sha256"

      - name: Generate Sparkle appcast
        run: |
          mkdir -p "$UPDATES_DIR" "$SITE_DIR/updates"

          RELEASE_ZIP="$RELEASE_DIR/${APP_NAME}-${VERSION}.zip"
          RELEASE_NOTES="$RUNNER_TEMP/RELEASE_NOTES.md"
          UPDATE_NOTES="$UPDATES_DIR/${APP_NAME}-${VERSION}.md"

          cp "$RELEASE_ZIP" "$UPDATES_DIR/${APP_NAME}-${VERSION}.zip"
          cp "$RELEASE_NOTES" "$UPDATE_NOTES"

          echo "${{ secrets.SPARKLE_PRIVATE_ED_KEY }}" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}" \
            --release-notes-url-prefix "${PAGES_BASE_URL}/updates/" \
            "$UPDATES_DIR"

          cp "$UPDATES_DIR/appcast.xml" "$SITE_DIR/appcast.xml"
          cp "$UPDATE_NOTES" "$SITE_DIR/updates/${APP_NAME}-${VERSION}.md"
          cp "$UPDATE_NOTES" "$SITE_DIR/updates/latest.md"
          if [ -f docs/updates/index.html ]; then
            cp docs/updates/index.html "$SITE_DIR/index.html"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: |
            ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.zip
            ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.zip.sha256
            ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.dmg
            ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.dmg.sha256
            ${{ runner.temp }}/site/appcast.xml

      - name: Attest release artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.zip

      - name: Attest release disk image
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.dmg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy_pages:
    runs-on: ubuntu-latest
    needs: build_release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
