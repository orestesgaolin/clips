name: Clips
options:
  bundleIdPrefix: dev.roszkowski
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2

targets:
  Clips:
    type: application
    platform: macOS
    sources:
      - path: Clips
        excludes:
          - Info.plist
    info:
      path: Clips/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Clips
        NSHumanReadableCopyright: "Copyright 2026 Dominik Roszkowski. All rights reserved."
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9JYPC6W7B2
        SWIFT_VERSION: "5"
        PRODUCT_NAME: Clips
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true
        SPARKLE_FEED_URL: https://orestesgaolin.github.io/clips/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: "yQg1h/yuV8QalL0F9YlPd7NTJCf9kA9ZWXkkLimn3Mo="
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.roszkowski.clips.debug
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.roszkowski.clips
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
          GCC_OPTIMIZATION_LEVEL: "3"
    dependencies:
      - package: Sparkle
        product: Sparkle
