name: Clips
options:
  bundleIdPrefix: dev.roszkowski
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2

targets:
  Clips:
    type: application
    platform: macOS
    sources:
      - path: Clips
        excludes:
          - Info.plist
          - AppStoreInfo.plist
    info:
      path: Clips/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Clips
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright 2026 Dominik Roszkowski. All rights reserved."
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 9JYPC6W7B2
        SWIFT_VERSION: "5"
        PRODUCT_NAME: Clips
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SPARKLE_FEED_URL: https://roszkowski.dev/clips/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: "yQg1h/yuV8QalL0F9YlPd7NTJCf9kA9ZWXkkLimn3Mo="
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          PRODUCT_BUNDLE_IDENTIFIER: dev.roszkowski.clips.debug
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": Clips
          PRODUCT_BUNDLE_IDENTIFIER: dev.roszkowski.clips
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
          GCC_OPTIMIZATION_LEVEL: "3"
    dependencies:
      - package: Sparkle
        product: Sparkle

  ClipsAppStore:
    type: application
    platform: macOS
    sources:
      - path: Clips
        excludes:
          - Info.plist
          - AppStoreInfo.plist
    info:
      path: Clips/AppStoreInfo.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Clips
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright 2026 Dominik Roszkowski. All rights reserved."
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: 9JYPC6W7B2
        SWIFT_VERSION: "5"
        PRODUCT_NAME: Clips
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Clips/AppStore.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          PRODUCT_BUNDLE_IDENTIFIER: dev.roszkowski.clips.appstore.debug
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG APP_STORE
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": Clips App Store
          PRODUCT_BUNDLE_IDENTIFIER: dev.roszkowski.clips
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE APP_STORE
          GCC_OPTIMIZATION_LEVEL: "3"

  ClipsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipsTests
    dependencies:
      - target: Clips
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 9JYPC6W7B2
        SWIFT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: YES
